<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<title>Robert's Favorite Button</title>
        <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="shortcut icon" href="favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Rob Button" />

        <link rel="manifest" href="site.webmanifest" />

        <meta name="description" content="Experience the joy of Robert's Favorite Button, a delightful interactive button designed for an engaging user experience. Perfect for adding a touch of fun to your life!" />
        <meta name="keywords" content="Robert's Favorite Button, interactive button, fun button, engaging user experience, delightful button, vibration, emojis, particle physics, FDT, ATF" />

		<style>
			html,
			body,
			* {
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				/* place-items: center; */
				font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: white;
                touch-action: manipulation;
			}

			main {
				display: flex;
					align-items: center;
					justify-content: center;
				flex-direction: column;
				gap: 12px;
				align-items: center;
			}

			main > div {
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none;
			}

			.controls {
				display: flex;
				gap: 12px;
			}

			h1 {
				margin: 0;
				font-size: 1.5rem;
			}
            h2 {
                margin: 0;
            }
            h3 {
                margin: 0;
            }

			button {
				font-size: 1rem;
				padding: 0.8rem 1.2rem;
				border: 0;
				border-radius: 10px;
				cursor: pointer;
                /* no text highlight */
                /* user-select: none; */
                color: black;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                display: flex;
                width: auto;
					max-width: 90vw;
                appearance: none;
                -webkit-appearance: none;
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none;
                -webkit-tap-highlight-color: transparent;
                outline: none;
                transition: transform 0.1s ease, box-shadow 0.1s ease;
			}

			button * {
				user-select: none;
				-webkit-user-select: none;
				-webkit-touch-callout: none;
			}
            button#buzzButton {
                /* make it gold and shiny */
                background: linear-gradient(45deg, #ffeb3b, #ffc107);
                color: #333;
                box-shadow: 0 4px 6px rgba(255, 193, 7, 0.4);
            }
            button#buzzButton:active {
                transform: scale(0.95);
                box-shadow: 0 2px 4px rgba(255, 193, 7, 0.2);
            }
			button.buzz-active {
				animation: buzzRotate 120ms ease-in-out infinite;
			}

			@keyframes buzzRotate {
				0% { transform: rotate(0deg); }
				25% { transform: rotate(-3deg); }
				50% { transform: rotate(3deg); }
				75% { transform: rotate(-2deg); }
				100% { transform: rotate(0deg); }
			}
			button:disabled {
				opacity: 0.7;
				cursor: not-allowed;
			}


			#particleCanvas {
				position: fixed;
				inset: 0;
				width: 100vw;
				height: 100vh;
				pointer-events: none;
                z-index: 214748365;
                overflow: hidden;
                user-select: none;
                contain: strict;
			}
		</style>
	</head>
	<body>
		<main>
            <div style="height: 300px;"></div>
			<button id="buzzButton" type="button" disabled>
                <h1>Robert's <i>Favorite</i> Button</h1>
            </button>
            <div style="height: calc(50vh - 100px);"></div>
			<button id="hapticButton" type="button" disabled>
                <h3>Robert's <small>(Second)</small> Favorite Button</h3>
            </button>
            <div style="height: 300px;"></div>
		</main>
		<canvas id="particleCanvas" aria-hidden="true"></canvas>

		<script type="module">
			import { WebHaptics } from "https://cdn.jsdelivr.net/npm/web-haptics@0.0.6/dist/index.mjs";

			const button = document.getElementById("hapticButton");
			const buzzButton = document.getElementById("buzzButton");
			const canvas = document.getElementById("particleCanvas");
			const ctx = canvas.getContext("2d");
			const haptics = new WebHaptics();
			const particles = [];
			const emojiCache = new Map();
			const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
			const MAX_ACTIVE = isMobile ? 180 : 500;
			const ANIM_FRAMES = 120;
			const MAX_DPR = 2;
			let dpr = 1;
			let rafId = null;

			const EMOJIS = {
				success: ["✅", "🎉", "✨", "💚", "👍"],
				buzz: ["🐝", "🍯", "🌼", "🫨"],
			};

			function setButtonsEnabled(enabled) {
				button.disabled = !enabled;
				buzzButton.disabled = !enabled;
			}

			function resizeCanvas() {
				dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
				const w = window.innerWidth;
				const h = window.innerHeight;
				const targetW = Math.round(w * dpr);
				const targetH = Math.round(h * dpr);

				if (canvas.width !== targetW || canvas.height !== targetH) {
					canvas.width = targetW;
					canvas.height = targetH;
					canvas.style.width = `${w}px`;
					canvas.style.height = `${h}px`;
				}
			}

			function getEmojiCanvas(emoji) {
				const cached = emojiCache.get(emoji);
				if (cached) return cached;

				const emDpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
				const CANONICAL_PX = 64;
				const fontSize = Math.ceil(CANONICAL_PX * emDpr);
				const size = Math.ceil(fontSize * 1.5);

				const offscreen = document.createElement("canvas");
				offscreen.width = size;
				offscreen.height = size;

				const offCtx = offscreen.getContext("2d");
				offCtx.textAlign = "center";
				offCtx.textBaseline = "middle";
				offCtx.font = `${fontSize}px serif`;
				offCtx.fillText(emoji, size / 2, size / 2);

				emojiCache.set(emoji, offscreen);
				return offscreen;
			}

			function prewarmEmojiCache() {
				for (const group of Object.values(EMOJIS)) {
					for (const emoji of group) {
						getEmojiCanvas(emoji);
					}
				}
			}

			function updateParticle(p) {
				p.a += p.xv * 0.5;
				p.yv *= 0.9;
				p.y += p.yv;
				p.xv *= 0.98;
				p.x += p.xv;
				p.s += (1 - p.s) * 0.3;
				p.xv += p.gx * 0.1;
				p.yv += (p.gy + p.yv) * 0.1;

				p.radius = p.fontSize * p.s * 0.5;

				p.life--;
				const lifeRatio = p.life / p.maxLife;
				if (lifeRatio < 0.25) {
					p.opacity = lifeRatio / 0.25;
				}

				return p.life > 0 && p.opacity > 0.01;
			}

			function spawnBurst(x, y, type) {
				const emojis = EMOJIS[type];
				const amount = 4;
				if (particles.length + amount > MAX_ACTIVE) return;

				for (let i = 0; i < amount; i++) {
					const xv = Math.random() * 16 - 8;
					const yv = (i === 0 ? 4 : i === 1 ? 8 : i === 2 ? 8 : 0) * (0.25 + Math.random() * 0.25);

					particles.push({
						x,
						y,
						xv,
						yv,
						a: 0,
						s: 0.2,
						opacity: 1,
						life: ANIM_FRAMES,
						maxLife: ANIM_FRAMES,
						emoji: emojis[Math.floor(Math.random() * emojis.length)],
						flipH: Math.random() < 0.5,
						fontSize: 20 + Math.ceil(Math.random() * 40),
						radius: 0,
						gx: 0,
						gy: -1.5,
					});
				}

				startLoop();
			}

			function resolveCollisions() {
				const n = particles.length;
				for (let i = 0; i < n; i++) {
					for (let j = i + 1; j < n; j++) {
						const a = particles[i];
						const b = particles[j];

						const dx = b.x - a.x;
						const dy = b.y - a.y;
						const distSq = dx * dx + dy * dy;
						const minDist = a.radius + b.radius;

						if (distSq < minDist * minDist && distSq > 0.0001) {
							const dist = Math.sqrt(distSq);
							const nx = dx / dist;
							const ny = dy / dist;

							const overlap = minDist - dist;
							const sep = overlap * 0.5;
							a.x -= nx * sep;
							a.y -= ny * sep;
							b.x += nx * sep;
							b.y += ny * sep;

							const dvx = a.xv - b.xv;
							const dvy = a.yv - b.yv;
							const dvDotN = dvx * nx + dvy * ny;

							if (dvDotN > 0) {
								const restitution = 0.5;
								const impulse = dvDotN * restitution;
								a.xv -= impulse * nx;
								a.yv -= impulse * ny;
								b.xv += impulse * nx;
								b.yv += impulse * ny;
							}
						}
					}
				}
			}

			function startLoop() {
				if (rafId !== null) return;
				updateAndDraw();
			}

			function updateAndDraw() {
				if (particles.length === 0) {
					ctx.setTransform(1, 0, 0, 1, 0, 0);
					ctx.clearRect(0, 0, canvas.width, canvas.height);
					rafId = null;
					return;
				}

				const curDpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);

				for (let i = particles.length - 1; i >= 0; i--) {
					if (!updateParticle(particles[i])) {
						particles[i] = particles[particles.length - 1];
						particles.pop();
					}
				}

				if (particles.length === 0) {
					ctx.setTransform(1, 0, 0, 1, 0, 0);
					ctx.clearRect(0, 0, canvas.width, canvas.height);
					rafId = null;
					return;
				}

				resolveCollisions();

				ctx.setTransform(1, 0, 0, 1, 0, 0);
				ctx.clearRect(0, 0, canvas.width, canvas.height);

				ctx.globalAlpha = 1;
				for (let pass = 0; pass < 2; pass++) {
					for (let i = 0; i < particles.length; i++) {
						const p = particles[i];
						const isFading = p.opacity < 1;

						if (pass === 0 && isFading) continue;
						if (pass === 1 && !isFading) continue;

						if (pass === 1) {
							ctx.globalAlpha = p.opacity;
						}

						const emojiImg = getEmojiCanvas(p.emoji);
						const drawSize = p.fontSize * p.s * 1.5;
						const halfSize = drawSize / 2;

						const rad = (p.a * Math.PI) / 180;
						const cos = Math.cos(rad) * curDpr;
						const sin = Math.sin(rad) * curDpr;
						const fx = p.flipH ? -1 : 1;
						ctx.setTransform(cos * fx, sin * fx, -sin, cos, p.x * curDpr, p.y * curDpr);

						ctx.drawImage(emojiImg, -halfSize, -halfSize, drawSize, drawSize);
					}
				}

				ctx.globalAlpha = 1;
				rafId = requestAnimationFrame(updateAndDraw);
			}

			function getCenter(el) {
				const rect = el.getBoundingClientRect();
				return {
					x: rect.left + rect.width / 2,
					y: rect.top + rect.height / 2,
				};
			}

			const buzzAnimTimers = new WeakMap();
			const HAPTIC_VISUAL_MS = {
				success: 120,
				buzz: 450,
			};

			function playBuzzRotation(targetButton, durationMs) {
				targetButton.classList.remove("buzz-active");
				void targetButton.offsetWidth;
				targetButton.classList.add("buzz-active");

				const existingTimer = buzzAnimTimers.get(targetButton);
				if (existingTimer) {
					clearTimeout(existingTimer);
				}

				const timer = setTimeout(() => {
					targetButton.classList.remove("buzz-active");
					buzzAnimTimers.delete(targetButton);
				}, durationMs);

				buzzAnimTimers.set(targetButton, timer);
			}

			button.addEventListener("click", () => {
				haptics.trigger("success");
				playBuzzRotation(button, HAPTIC_VISUAL_MS.success);
				const { x, y } = getCenter(button);
				spawnBurst(x, y, "success");
			});

			buzzButton.addEventListener("click", () => {
				haptics.trigger("buzz");
				playBuzzRotation(buzzButton, HAPTIC_VISUAL_MS.buzz);
				const { x, y } = getCenter(buzzButton);
				spawnBurst(x, y, "buzz");
			});

			// Enable :active styles on mobile Safari
            document.addEventListener("touchstart", () => {}, { passive: true });
			document.addEventListener("gesturestart", (event) => {
				event.preventDefault();
			});


			window.addEventListener("resize", resizeCanvas);
			resizeCanvas();
			prewarmEmojiCache();
			setButtonsEnabled(true);
		</script>
	</body>
</html>
